{% extends "base.html" %}
{% block title %}Redeem Device — Affiliate{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Redeem Code</h1><p class="muted">Copy the one-time Redeem Code from the Affiliate app and paste it here.</p></div></div>
<section class="card form-card">
  <label>Friendly name (optional)<input id="device-name" type="text" placeholder="My Phone"></label>
  <label>Redeem Code<input id="pair-json" type="text" maxlength="64" autocomplete="off" placeholder="24-character one-time code"></label>
  <button id="pair-btn" class="primary" type="button">Redeem and Connect</button>
  <p id="pair-result" class="meta" role="status"></p>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/pair.js"></script>{% endblock %}
