<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}PrivatChat{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234c8dff'/%3E%3Cpath d='M18 34l10 10 18-22' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">PrivatChat</a>
    {% if owner_name %}
    <nav class="nav">
      <a href="/">Devices</a>
      <a href="/devices/add">Add Device</a>
      <a href="/settings">Settings</a>
      <form class="inline" method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button type="submit" class="linkish">Logout</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
